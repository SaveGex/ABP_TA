services:
  db:
    build:
      context: .
      dockerfile: src/Database/Dockerfile
    container_name: booking-db
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "14330:1433"
    volumes:
      - booking-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/scripts/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - booking-net

  api:
    build:
      context: .
      dockerfile: src/MainWeb/Dockerfile
    container_name: booking-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${MSSQL_DATABASE};User Id=${MSSQL_USER};Password=${MSSQL_USER_PASSWORD};TrustServerCertificate=True;"
    networks:
      - booking-net

  cert-gen:
      image: alpine
      container_name: booking-cert-gen
      volumes:
        - ./src/nginx:/src/nginx
      working_dir: /src/nginx
      command: >
        /bin/sh -c "
        apk add --no-cache openssl && \
        chmod +x ./scripts/generate_cert.sh && \
        /bin/sh ./scripts/generate_cert.sh
        "

  nginx:
    image: nginx:alpine
    container_name: booking-proxy
    restart: always
    ports:
      - "80:80" # redirect into HTTPS
      - "443:443" # HTTPS
    volumes:
      - ./src/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
      cert-gen:
        condition: service_completed_successfully
    networks:
      - booking-net

volumes:
  booking-db-data:

networks:
  booking-net:
    driver: bridge
